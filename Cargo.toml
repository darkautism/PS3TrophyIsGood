[package]
name = "ps3trophyisgood"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform PS3 / RPCS3 trophy editor using Rust and GPUI"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:gpui_ce_elements", "dep:rfd"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = true }
roxmltree = "0.20"
rand = "0.8"
scraper = "0.23"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json = "1"
tempfile = "3.15"
gpui = { package = "gpui-ce", version = "=0.3.0", optional = true }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", features = ["font-kit", "wayland", "x11"], optional = true }
gpui_ce_elements = { version = "=0.3.0", optional = true }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "ps3trophyisgood"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

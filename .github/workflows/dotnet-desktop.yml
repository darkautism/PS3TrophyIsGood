name: .NET Core Desktop

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: windows-latest
    env:
      Solution_Name: PS3TrophyIsGood.sln
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 5.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore
      run: dotnet restore --locked-mode

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build identity mapping regression tests
      run: msbuild tests/IdentityMappingRegression/IdentityMappingRegression.csproj /p:Configuration=Release /p:Platform=AnyCPU

    - name: Run identity mapping regression tests
      shell: pwsh
      run: |
        $appDir = "PS3TrophyIsGood/bin/Release"
        $testExe = Join-Path $appDir "IdentityMappingRegression.exe"
        Copy-Item "tests/IdentityMappingRegression/bin/Release/IdentityMappingRegression.exe" $testExe
        & "./$testExe"
        $testExitCode = $LASTEXITCODE
        Remove-Item $testExe
        if ($testExitCode -ne 0) { exit $testExitCode }

    - name: Upload files
      uses: actions/upload-artifact@v4
      with:
        name: PS3TrophyIsGood
        path: PS3TrophyIsGood/bin/Release

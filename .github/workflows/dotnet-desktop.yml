name: .NET Core Desktop

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: windows-latest
    env:
      Solution_Name: PS3TrophyIsGood.sln
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 5.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore
      run: dotnet restore --locked-mode

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Download latest FlareSolverr and verify checksum
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $headers = @{ 'User-Agent' = 'PS3TrophyIsGood-build' }
        $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/FlareSolverr/FlareSolverr/releases/latest'
        $asset = $release.assets | Where-Object { $_.name -eq 'flaresolverr_windows_x64.zip' } | Select-Object -First 1

        if (-not $asset) {
          throw "FlareSolverr release $($release.tag_name) does not contain flaresolverr_windows_x64.zip"
        }

        $archive = Join-Path $env:RUNNER_TEMP 'flaresolverr_windows_x64.zip'
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $archive

        if ($asset.digest -and $asset.digest.StartsWith('sha256:')) {
          $expected = $asset.digest.Substring('sha256:'.Length).ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FlareSolverr checksum mismatch. Expected $expected, got $actual"
          }
        }
        else {
          Write-Warning 'FlareSolverr release did not publish a SHA-256 digest; continuing without checksum verification.'
        }

        $destination = 'PS3TrophyIsGood/bin/Release'
        Expand-Archive -Path $archive -DestinationPath $destination -Force

        $solverExe = Join-Path $destination 'flaresolverr/flaresolverr.exe'
        if (-not (Test-Path $solverExe)) {
          throw "FlareSolverr archive layout changed: $solverExe was not found"
        }

        Set-Content -Path (Join-Path $destination 'flaresolverr/flaresolverr.version') -Value $release.tag_name -NoNewline
        Write-Host "Bundled FlareSolverr $($release.tag_name)"

    - name: Upload files
      uses: actions/upload-artifact@v4
      with:
        name: PS3TrophyIsGood
        path: PS3TrophyIsGood/bin/Release
